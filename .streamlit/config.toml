[server]
headless = true
maxUploadSize = 10
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"
[theme]
base = "light"
primaryColor = "#087F73"
backgroundColor = "#F7F9F8"
secondaryBackgroundColor = "#EDF3F0"
textColor = "#173B35"
borderColor = "#DCE6E1"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
baseFontSize = 15
headingFontSizes = ["2.3rem", "1.7rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [650, 600, 600]
showWidgetBorder = true
showSidebarBorder = false
chartCategoricalColors = ["#087F73", "#D3A654", "#5B86A6", "#A083AC"]
[theme.sidebar]
backgroundColor = "#123C35"
secondaryBackgroundColor = "#1D4B42"
textColor = "#E9F3EE"
primaryColor = "#A9D9BA"
borderColor = "#315D52"
headingFontSizes = ["1.5rem", "1.25rem", "1.1rem"]
